name: macOS

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    branches:
      - main

jobs:
  macos:
    name: macOS unit tests and clippy
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: cargo test --workspace --all-targets --release

      - run: cargo clippy --no-deps --all-targets -- --deny warnings

      # gettext is only type-checked: macOS has no libintl to link
      - name: Check optional features
        run: |
          for feature in pam-login gettext unstable-remote-sudoers; do
            cargo check --all-targets --features "$feature"
          done
